<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <meta name="description" content="3D fingering chart for brass and woodwind instruments, with sampled audio." />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Fingering Chart 3D</title>
  </head>
  <body>
    <header class="top">
      <h1>Fingering Chart <span>3D</span></h1>
      <label class="picker">
        <span class="sr-only">Instrument</span>
        <select id="instrument"></select>
      </label>
      <div class="variant" id="variant" role="group" aria-label="Version" hidden></div>
    </header>

    <main class="layout">
      <section class="viewer" id="viewer" aria-label="3D instrument model">
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="loading" id="loading" hidden>Loading…</div>
        <button class="reset-view" id="reset-view" title="Reset view (R)">⟲ Reset view</button>
        <p class="hint">Drag to rotate · right-drag or two fingers to move · scroll or pinch to zoom · tap a key for its name</p>
        <p class="credit" id="credit" hidden></p>
      </section>

      <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"
        aria-label="Resize panel (double-click to reset)" title="Drag to resize · double-click to reset"></div>

      <section class="panel">
        <div class="note-card">
          <button class="nav" id="prev" aria-label="Previous note">‹</button>
          <div class="note-text">
            <div class="note-name" id="note-name">–</div>
            <div class="note-sub" id="note-sub"></div>
          </div>
          <button class="nav" id="next" aria-label="Next note">›</button>
        </div>

        <input type="range" id="range" min="0" max="0" value="0" aria-label="Note" />

        <div class="actions">
          <button class="primary" id="play" aria-pressed="false">▶ Play</button>
          <button id="scale">Play scale</button>
          <button id="tuner-toggle" aria-pressed="false" aria-controls="tuner">🎤 Tuner</button>
        </div>

        <div class="scale-options">
          <label class="scale-key">
            <span class="sr-only">Scale</span>
            <select id="scale-key"></select>
          </label>
          <div class="octaves" id="octaves" role="group" aria-label="Octaves">
            <button data-octaves="1" aria-pressed="true">1</button>
            <button data-octaves="2" aria-pressed="false">2</button>
            <button data-octaves="3" aria-pressed="false">3</button>
            <button data-octaves="4" aria-pressed="false">4</button>
            <span class="octaves-label">oct</span>
          </div>
        </div>
        <p class="scale-info" id="scale-info"></p>

        <div class="tuner" id="tuner" hidden>
          <button class="tuner-note" id="tuner-note" title="Show this note's fingering" disabled>–</button>
          <div class="tuner-gauge" aria-hidden="true">
            <span class="tuner-scale"><span>♭</span><span>−25</span><span>0</span><span>+25</span><span>♯</span></span>
            <span class="tuner-track"><span class="tuner-needle" id="tuner-needle"></span></span>
          </div>
          <div class="tuner-readout" id="tuner-readout" aria-live="polite">Play a note…</div>
        </div>

        <div class="fingering">
          <div class="fingering-head">
            <h2>Press</h2>
            <button class="link" id="alt" hidden></button>
          </div>
          <ul id="keys"></ul>
        </div>

        <div class="staff-wrap" id="staff-wrap">
          <div class="staff-head">
            <button class="staff-btn" id="staff-prev" aria-label="Previous note">‹</button>
            <span class="staff-title" id="staff-title"></span>
            <button class="staff-btn" id="staff-next" aria-label="Next note">›</button>
            <button class="staff-btn" id="staff-full" aria-label="Fullscreen staff" title="Fullscreen">⛶</button>
          </div>
          <div class="staff" id="staff"></div>
        </div>

        <p class="audio-status" id="audio-status"></p>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
